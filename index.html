<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Little Game For You</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1 id="title"></h1>
    <p id="intro" class="muted"></p>

    <div id="progress" class="progress"><span id="bar"></span></div>

    <section id="game" hidden>
      <p id="count" class="muted"></p>
      <h2 id="question"></h2>
      <form id="form">
        <input id="answer" type="text" autocomplete="off" placeholder="Type your answer..." required>
        <button type="submit">Answer</button>
      </form>
      <p id="feedback" class="feedback"></p>
      <button id="hintBtn" class="ghost" type="button">Need a hint?</button>
      <p id="hint" class="muted"></p>
    </section>

    <button id="start">Start</button>

    <section id="reward" hidden>
      <h2 id="playlistTitle"></h2>
      <p id="final" class="muted"></p>
      <ul id="songs"></ul>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
